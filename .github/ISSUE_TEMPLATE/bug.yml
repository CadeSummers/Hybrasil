name: Bug
description: The map or the code does something it should not.
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Alpha Centauri
        2. Press Bands
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: The live site, or a command (for example python -m hybrasil.cli --system solar).
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Firefox 140 on Windows 11, Safari on iPhone
  - type: textarea
    id: extra
    attributes:
      label: Screenshot or console output
