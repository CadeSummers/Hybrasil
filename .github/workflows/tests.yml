#
# The whole suite, browser tests included, against the committed workbook
# snapshot.  The job is named `tests`: that is the required status check on
# main, and pages.yml calls this file so nothing deploys from a red commit.
#
# A snapshot pull request (snapshot.yml) is opened by github-actions[bot], so
# its run waits for "Approve workflows to run": a dispatched run would not
# count as the required check.  docs/architecture/catalog.md.
#
# A push runs it only where nothing else does: main is tested by pages.yml
# before it deploys, and pr/* and snapshot/* branches by their pull request.

name: tests

on:
  push:
    branches-ignore: [main, "pr/**", "snapshot/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45  # about 25 on a hosted runner, browser tests included
    env:
      HYBRASIL_DATA_SOURCE: snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      # astropy: test_reference_arrows' cross-check, skipped without it
      - run: pip install -r requirements-dev.txt astropy
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -rs
