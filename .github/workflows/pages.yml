#
# hybrasil.app is main: every push to main is built and deployed to the
# Cloudflare Pages project `hybrasil` (Direct Upload), once the tests pass.
# The weekly run rebuilds the same commit, because scenes start at build time
# (web/static_site.py), and a hand-run does the same on demand.
#
# Deploys only from CadeSummers/Hybrasil's main.  Hybrasil-dev carries the
# same files and runs the tests job, but its deploy job is skipped.  Never
# add pull_request or pull_request_target here: the deploy holds secrets.
#
# Needs, in the GitHub environment `production` (restricted to main):
#   secrets   CLOUDFLARE_API_TOKEN  (Account: Cloudflare Pages Edit, D1 Edit)
#             CLOUDFLARE_ACCOUNT_ID
#             D1_DATABASE_ID        (hybrasil-suggestions)
#   variable  HYBRASIL_TURNSTILE_SITEKEY  (public; read by the build)
# Pages secrets TURNSTILE_SECRET and IP_SALT live on the project, not here.
# docs/architecture/web-app.md (Deploy), docs/architecture/suggestions.md.

name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    if: github.repository == 'CadeSummers/Hybrasil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://hybrasil.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt

      - name: Build the static site
        env:
          HYBRASIL_DATA_SOURCE: snapshot
          HYBRASIL_TURNSTILE_SITEKEY: ${{ vars.HYBRASIL_TURNSTILE_SITEKEY }}
        run: python -m hybrasil.cli --build-site site

      # wrangler.toml is git-ignored, so no Cloudflare identifier is committed.
      - name: Write wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          test -n "$D1_DATABASE_ID"
          sed "s/<D1_DATABASE_ID>/$D1_DATABASE_ID/" wrangler.example.toml > wrangler.toml
          ! grep -q "<D1_DATABASE_ID>" wrangler.toml

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          wranglerVersion: "4.142.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply hybrasil-suggestions --remote

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0  # v4.1.3
        with:
          wranglerVersion: "4.142.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name hybrasil --branch main --commit-hash ${{ github.sha }} --commit-dirty=true
